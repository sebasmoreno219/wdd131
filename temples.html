<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WDD 131 - Temple Album - Sebastian Moreno</title>

    <meta name="description"
        content="A responsive temple picture album featuring beautiful architecture from around the world.">

    <meta name="author" content="Sebastian Moreno">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>
        <div class="header-container">
            <div class="site-title">Temple Album</div>

            <button id="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"
                aria-controls="nav-menu">
                &#9776;
            </button>
        </div>

        <nav id="nav-menu" aria-label="Main navigation">
            <a href="#" class="active" aria-current="page">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h1>Home</h1>

        <div class="grid-container">

            <figure>
                <img src="images/cochabamba-temple.webp"
                    alt="Exterior photo of the Cochabamba Bolivia Temple" width="400" height="250" loading="lazy">
                <figcaption>Cochabamba Bolivia Temple</figcaption>
            </figure>

            <figure>
                <img src="images/kyiv-temple.webp"
                    alt="Exterior photo of the Kyiv Ukraine Temple" width="400" height="250" loading="lazy">
                <figcaption>Kyiv Ukraine Temple</figcaption>
            </figure>

            <figure>
                <img src="images/anchorage-temple.webp"
                    alt="The Anchorage Alaska Temple in winter with snow on the ground and illuminated windows"
                    width="400" height="250" loading="lazy">
                <figcaption>Anchorage Alaska Temple</figcaption>
            </figure>

            <figure>
                <img src="images/cardston-temple.webp"
                    alt="Exterior of the Cardston Alberta Temple in Canada under a cloudy sky" width="400" height="250"
                    loading="lazy">
                <figcaption>Cardston Alberta Temple</figcaption>
            </figure>

            <figure>
                <img src="images/concepcion-temple.webp"
                    alt="Exterior of the Concepción Chile Temple" width="400" height="250" loading="lazy">
                <figcaption>Concepción Chile Temple</figcaption>
            </figure>

            <figure>
                <img src="images/laie-temple.webp"
                    alt="Exterior of the Laie Hawaii Temple with a reflecting pool in the foreground" width="400"
                    height="250" loading="lazy">
                <figcaption>Laie Hawaii Temple</figcaption>
            </figure>

            <figure>
                <img src="images/london-temple.webp"
                    alt="The London England Temple illuminated during the evening" width="400" height="250"
                    loading="lazy">
                <figcaption>London England Temple</figcaption>
            </figure>

            <figure>
                <img src="images/panama-temple.webp"
                    alt="The Panama City Panama Temple surrounded by palm trees" width="400" height="250"
                    loading="lazy">
                <figcaption>Panama City Panama Temple</figcaption>
            </figure>

            <figure>
                <img src="images/port-au-temple.webp"
                    alt="Exterior of the Port-au-Prince Haiti Temple" width="400" height="250" loading="lazy">
                <figcaption>Port-au-Prince Haiti Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Sebastian Moreno | Bolivia</p>
        <p class="last-modified">
            Last Modification: <span id="lastModified"></span>
        </p>
    </footer>
</body>

</html>
